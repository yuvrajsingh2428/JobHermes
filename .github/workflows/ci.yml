name: CI Test Suite & Code Quality

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node-version }} - Quality & Tests
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]

    env:
      OPENAI_API_KEY: mock
      SEND_REAL_EMAILS: "false"
      NODE_ENV: test
      CI: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify Prettier Code Formatting
        run: npm run format:check

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript Type Check
        run: npm run typecheck

      - name: Validate Production Build & Assets
        run: npm run build

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium & system dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run Unit Tests
        run: npm run test:unit

      - name: Run Contract Tests (Offline Fixtures)
        run: npm run test:contract

      - name: Run REST API Integration Tests
        run: npm run test:api

      - name: Run Playwright E2E Tests on Demo Sandbox
        run: npm run test:e2e

      - name: Generate Code Coverage Report
        run: npm run test:coverage

      - name: Upload Coverage Artifacts
        if: matrix.node-version == '20.x' && success()
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: coverage/
          retention-days: 14

      - name: Upload E2E Diagnostics on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-diagnostics-${{ matrix.node-version }}
          path: |
            test-results/
            logs/
            output/
          retention-days: 7
